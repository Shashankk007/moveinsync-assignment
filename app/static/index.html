<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RideOps · Escalation check</title>
  <script>
    // Theme before first paint, so there is no flash.
    (function () {
      var saved = localStorage.getItem("theme");
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23047857'/%3E%3Ccircle cx='8' cy='12' r='2.4' fill='white'/%3E%3Cpath d='M10.6 12h3' stroke='white' stroke-width='1.7'/%3E%3Ccircle cx='16.2' cy='12' r='2.4' fill='none' stroke='white' stroke-width='1.7'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="mark" width="24" height="24" rx="7"/><circle class="glyph-f" cx="8" cy="12" r="2.4"/><path class="glyph-s" d="M10.6 12h3" stroke-width="1.7"/><circle class="glyph-s" cx="16.2" cy="12" r="2.4" stroke-width="1.7"/></svg>
      <span class="name">RideOps</span>
    </div>
    <nav class="nav" aria-label="Main">
      <button data-view="check" aria-current="page">Escalation check</button>
      <button data-view="scorecard">Scorecard</button>
    </nav>
    <div class="top-right">
      <span class="asof mono" id="asof"></span>
      <button class="mode-btn" id="theme-toggle" aria-label="Switch between light and dark mode">
        <svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2.4M10 15.6V18M2 10h2.4M15.6 10H18M4.3 4.3l1.7 1.7M14 14l1.7 1.7M4.3 15.7 6 14M14 6l1.7-1.7"/></svg>
        <svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.6A7 7 0 0 1 7.4 3.5a7 7 0 1 0 9.1 9.1Z"/></svg>
        <span class="lbl" id="mode-label">Dark</span>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <div class="toast" id="toast" role="status"></div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
